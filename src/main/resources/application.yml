spring:
  application:
    name: stock-trades-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:stocktrades;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jackson:
    time-zone: GMT
    default-property-inclusion: non_null
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8000}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: Stock Trades API
    description: Trade capture and query API for stock transactions
    java-version: 17

app:
  cache:
    ttl: PT5M
    maximum-size: 1000
  security:
    enabled: false
    username: trade-api-user
    password: trade-api-password

assessment:
  api:
    base-path:
